[project]
name = "bathroom-spatial-studio"
version = "1.0.1"
description = "OpenAI-compatible bathroom plan and photo to editable 3D model"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<12",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "fastembed>=0.7,<0.8",
  "defusedxml>=0.7,<1",
  "ezdxf>=1.4,<2",
  "svgelements>=1.9,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[project.optional-dependencies]
voice = [
  "av>=14,<17",
  "edge-tts>=7.2,<8",
  "funasr>=1.2,<2",
  "modelscope>=1.20,<2",
  "soundfile>=0.13,<1",
  "torch>=2.7,<3",
  "torchaudio>=2.7,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
